<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Product charger LED state matrix</title>
  <desc id="desc">All product charger states with physical LED color, screen prompt, driver action, and OCPP or payment behavior.</desc>
  <rect width="1200" height="860" fill="#f8fafc"/>
  <text x="54" y="64" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Product states and LED colors</text>
  <text x="56" y="98" font-family="Arial, sans-serif" font-size="18" fill="#475569">The station rail shows charger state. The RFID scanner blinks green on success and red on rejection.</text>

  <rect x="54" y="134" width="1092" height="54" rx="6" fill="#e2e8f0"/>
  <text x="88" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">State</text>
  <text x="290" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Bulb</text>
  <text x="448" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Screen</text>
  <text x="666" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Driver action</text>
  <text x="882" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">System behavior</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="54" y="204" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="246" font-weight="700" fill="#0f172a">Booting</text>
    <circle cx="310" cy="239" r="18" fill="#d97706"/>
    <text x="342" y="245" fill="#334155">Amber</text>
    <text x="448" y="245" fill="#334155">Connecting</text>
    <text x="666" y="245" fill="#334155">Wait</text>
    <text x="882" y="245" fill="#334155">BootNotification</text>

    <rect x="54" y="286" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="328" font-weight="700" fill="#0f172a">Ready</text>
    <circle cx="310" cy="321" r="18" fill="#16803c"/>
    <text x="342" y="327" fill="#334155">Green</text>
    <text x="448" y="327" fill="#334155">Ready / Tap RFID</text>
    <text x="666" y="327" fill="#334155">Tap card or Start</text>
    <text x="882" y="327" fill="#334155">StatusNotification Available</text>

    <rect x="54" y="368" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="410" font-weight="700" fill="#0f172a">Authorize</text>
    <circle cx="310" cy="403" r="18" fill="#2563eb"/>
    <text x="342" y="409" fill="#334155">Blue</text>
    <text x="448" y="409" fill="#334155">Tap card</text>
    <text x="666" y="409" fill="#334155">RFID or PIN</text>
    <text x="882" y="409" fill="#334155">Authorize</text>

    <rect x="54" y="450" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="492" font-weight="700" fill="#0f172a">Plug In</text>
    <circle cx="310" cy="485" r="18" fill="#d97706"/>
    <text x="342" y="491" fill="#334155">Amber</text>
    <text x="448" y="491" fill="#334155">Plug in</text>
    <text x="666" y="491" fill="#334155">Connect cable</text>
    <text x="882" y="491" fill="#334155">TransactionEvent Authorized</text>

    <rect x="54" y="532" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="574" font-weight="700" fill="#0f172a">Charging</text>
    <circle cx="310" cy="567" r="18" fill="#2563eb"/>
    <text x="342" y="573" fill="#334155">Blue</text>
    <text x="448" y="573" fill="#334155">Charging</text>
    <text x="666" y="573" fill="#334155">Stop if needed</text>
    <text x="882" y="573" fill="#334155">Meter values + CostUpdated</text>

    <rect x="54" y="614" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="656" font-weight="700" fill="#0f172a">Suspended</text>
    <circle cx="310" cy="649" r="18" fill="#d97706"/>
    <text x="342" y="655" fill="#334155">Amber</text>
    <text x="448" y="655" fill="#334155">Charging paused</text>
    <text x="666" y="655" fill="#334155">Reconnect cable</text>
    <text x="882" y="655" fill="#334155">SuspendedEVSE, timeout</text>

    <rect x="54" y="696" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="738" font-weight="700" fill="#0f172a">Billing</text>
    <circle cx="310" cy="731" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="342" y="737" fill="#334155">White</text>
    <text x="448" y="737" fill="#334155">Billing + UPI QR</text>
    <text x="666" y="737" fill="#334155">Scan QR / Pay</text>
    <text x="882" y="737" fill="#334155">Ended + upi://pay</text>

    <rect x="54" y="778" width="1092" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="820" font-weight="700" fill="#0f172a">Attention</text>
    <circle cx="310" cy="813" r="18" fill="#b42318"/>
    <text x="342" y="819" fill="#334155">Red</text>
    <text x="448" y="819" fill="#334155">Attention</text>
    <text x="666" y="819" fill="#334155">Retry / support</text>
    <text x="882" y="819" fill="#334155">Rejected, failed, unavailable</text>
  </g>
</svg>
