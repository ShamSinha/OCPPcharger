  <text x="148" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">CS01</text>
  <circle cx="155" cy="196" r="15" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><text x="182" y="202" font-family="Arial, sans-serif" font-size="16" fill="#334155">Ready</text>
